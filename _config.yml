title: El Observador de Lanzarote
description: >-
  Citas y comenta, con atribución, contenido de opinión ya publicado por medios
  de comunicación reales sobre la gestión de los ayuntamientos de Lanzarote.
  Empieza por San Bartolomé y Teguise.
lang: es

# Línea que aparece en la cintilla superior (sustituye al nombre, que ya está
# grande en la cabecera). Cámbiala cuando quieras, es solo texto.
tagline: "Tribuna ciudadana donde se muestran las opiniones de los vecinos"

# Correo de contacto que se muestra en la cintilla inferior para que los
# lectores puedan enviar avisos o noticias. Déjalo vacío para ocultar la cintilla.
contact_email: "elobservatoriodelanzarote@gmail.com"
url: "https://elobservadordelanzarote.github.io"
baseurl: ""

# --- Colección de fichas de caso ---
# Cada ficha es un archivo .md dentro de la carpeta _fichas/
# El nombre de archivo no importa para la web, pero usa siempre AAAA-MM-DD-titulo-corto.md
#
# --- Colección "Contrapunto" (columna derecha: opinión del alcalde + reacción
# ciudadana ya publicadas) --- Cada entrada es un archivo .md en _contrapunto/
collections:
  fichas:
    output: true
    permalink: /:collection/:year/:month/:title/
  contrapunto:
    output: true
    permalink: /:collection/:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: "fichas"
    values:
      layout: "ficha"
  - scope:
      path: ""
      type: "contrapunto"
    values:
      layout: "contrapunto"
  - scope:
      path: ""
    values:
      layout: "default"

# --- Plugins permitidos por GitHub Pages sin configuración extra ---
plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
